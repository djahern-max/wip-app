# TLS settings for jobcost.dev (F05.0). Installed by deploy/setup.sh as
# /etc/nginx/snippets/wip-tls.conf. Certbot's recommended options (Mozilla
# "intermediate") without the DHE suites: no ssl_dhparam is generated, so only the
# ECDHE suites and TLS 1.3 are offered. The certificate paths are in the site file.
ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
