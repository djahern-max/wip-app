# jobcost.dev (F05.0, D-27). Installed by deploy/setup.sh as
# /etc/nginx/sites-available/jobcost.dev once the certificate exists. Three server
# blocks: port 80 for both names (ACME challenge, everything else to the apex over
# https); port 443 for www (to the apex); port 443 for the apex (the built frontend,
# the three static pages, /api/ to uvicorn). Headers: snippets/wip-security-headers.conf.
# No add_header outside that include, so a location never silently drops the set.

server {
    listen 80;
    server_name jobcost.dev www.jobcost.dev;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jobcost.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.jobcost.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jobcost.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobcost.dev/privkey.pem;
    include snippets/wip-tls.conf;
    include snippets/wip-security-headers.conf;

    return 301 https://jobcost.dev$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jobcost.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jobcost.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobcost.dev/privkey.pem;
    include snippets/wip-tls.conf;
    include snippets/wip-security-headers.conf;

    root /opt/wip/frontend/dist;

    # = MAX_UPLOAD_BYTES (26214400) in /etc/wip/app.env: the API refuses larger
    # uploads itself; nginx just stops them earlier.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The three pages Intuit requires (D-22: plain HTML, no script), served as files;
    # the React router never sees them.
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }
    location = /qbo/disconnected {
        try_files /qbo-disconnected.html =404;
    }

    # Vite hashes the bundle names, so they may be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/wip-security-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never appended: the header then carries only what nginx saw, which is
        # what TRUSTED_PROXY_COUNT=1 reads (the rightmost address).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # index.html is never cached: a release must show the new bundle at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/wip-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
