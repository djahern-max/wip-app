# Response headers for jobcost.dev (F05.0, plan question 3). Installed by
# deploy/setup.sh as /etc/nginx/snippets/wip-security-headers.conf and included at
# server level in both https blocks and again inside every location that has its own
# add_header (nginx drops inherited add_header lines there). tests/test_deploy.py pins
# the Content-Security-Policy string; CI checks the built index.html satisfies it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
