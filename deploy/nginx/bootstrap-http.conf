# jobcost.dev, port 80 only (F05.0). Used by deploy/setup.sh until the first Let's
# Encrypt certificate exists, then replaced by jobcost.dev.conf. Answers the ACME
# challenge from the webroot; everything else is 404 (there is nothing to redirect to yet).
server {
    listen 80;
    server_name jobcost.dev www.jobcost.dev;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
