name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Plain values for the throwaway service container; nothing here is a secret.
    # No crypto key is set: Alembic reads DATABASE_OWNER_URL only, and the test
    # suite generates its own key ring at session start (F02.1 CI first-run fix).
    env:
      PGHOST: localhost
      PGPORT: "5433"
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql+psycopg://app_rw:app_rw_dev@localhost:5433/wip_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://app_owner:app_owner_dev@localhost:5433/wip_test
      DATABASE_URL: postgresql+psycopg://app_rw:app_rw_dev@localhost:5433/wip
      DATABASE_OWNER_URL: postgresql+psycopg://app_owner:app_owner_dev@localhost:5433/wip
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a tracked .env (F02.1)
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked; it must never be committed"; exit 1
          fi
      - name: Refuse tracked files under the local object store (F03)
        run: |
          if [ -n "$(git ls-files .object-store)" ]; then
            echo "::error::files under .object-store are tracked; the local store is never committed"; exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create DB roles and databases
        run: db/init/01_roles.sh
        env:
          APP_DATABASES: wip wip_test wip_scratch
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Lint (ruff pinned to the local version, F02.1)
        working-directory: backend
        run: |
          pip install ruff==0.16.8
          ruff --version | grep -q '0.16.8'
          ruff check . && ruff format --check .
      - name: Migration up / down on an empty scratch database (never the dev/prod name)
        working-directory: backend
        env:
          DATABASE_OWNER_URL: postgresql+psycopg://app_owner:app_owner_dev@localhost:5433/wip_scratch
          ALLOW_DESTRUCTIVE_DOWNGRADE: "1"
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: The downgrade guard refuses the configured dev database
        working-directory: backend
        run: |
          if ALLOW_DESTRUCTIVE_DOWNGRADE=1 alembic downgrade base; then
            echo "::error::downgrade against 'wip' was not refused"; exit 1
          fi
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Current LTS (F03): Node 24. The pin lives in frontend/.nvmrc; the droplet's
          # setup.sh reads the same file (F05.0, plan question 5).
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Unit tests (node --test, no dependency)
        working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - name: The build satisfies the Content-Security-Policy (F05.0) and carries the brand assets (F05.2)
        working-directory: frontend
        # No inline script and no <style> block or style= attribute in the built
        # index.html: the CSP in deploy/nginx/security-headers.conf is script-src 'self';
        # style-src 'self'. The three static pages and their stylesheet must be in dist/.
        # F05.2: the generated brand assets are committed, so dist/ must carry them, and
        # dist/brand-manifest.json must record the SHA-256 of the logo (and mark) as built:
        # a swapped logo committed without `npm run brand` fails here.
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("dist/index.html").read()
          bad = [m.group(0) for m in re.finditer(r"<script\b[^>]*>", html) if not re.search(r"\ssrc=", m.group(0))]
          bad += re.findall(r"<style\b", html) + re.findall(r"\sstyle=", html)
          if bad:
              print("::error::inline script or style in dist/index.html:", bad)
              sys.exit(1)
          if re.search(r"%[A-Z_]+%", html):
              print("::error::a product placeholder was not filled in dist/index.html (vite.config.js, D-33)")
              sys.exit(1)
          for f in ("privacy.html", "terms.html", "qbo-disconnected.html", "pages.css"):
              try:
                  open("dist/" + f).close()
              except OSError:
                  print("::error::missing from the build: " + f)
                  sys.exit(1)
          import hashlib, json
          for f in ("favicon.ico", "favicon.svg", "apple-touch-icon.png", "icon-192.png", "icon-512.png",
                    "site.webmanifest", "og-image.png", "brand/logo.svg", "brand-manifest.json"):
              try:
                  open("dist/" + f).close()
              except OSError:
                  print("::error::missing from the build: " + f + " (run `npm run brand` in frontend/ and commit)")
                  sys.exit(1)
          recorded = json.load(open("dist/brand-manifest.json"))["sources"]
          for src, built in (("public/brand/logo.svg", "dist/brand/logo.svg"),
                             ("public/brand/logo-mark.svg", "dist/brand/logo-mark.svg")):
              try:
                  actual = hashlib.sha256(open(built, "rb").read()).hexdigest()
              except OSError:
                  actual = None
              if recorded.get(src) != actual:
                  print("::error::" + src + " does not match the SHA-256 in brand-manifest.json: "
                        "the brand assets were not regenerated. Run `npm run brand` in frontend/ and commit the outputs.")
                  sys.exit(1)
          print("dist/index.html has no inline script or style; the three pages and the brand assets are present")
          PY
